version: '3.8'

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: safevoice_db
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=SafeVoice_Admin123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - safevoice_mssql_data:/var/opt/mssql

volumes:
  safevoice_mssql_data:
